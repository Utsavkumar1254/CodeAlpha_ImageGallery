<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      font-family: 'Outfit', sans-serif;
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(120, 40, 200, 0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(0, 200, 180, 0.08) 0%, transparent 40%);
    }

    .calc-wrapper {
      animation: slideUp 0.5s cubic-bezier(.22,1,.36,1) both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .calculator {
      width: 340px;
      background: #12121a;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid #2a2a3a;
      box-shadow:
        0 40px 80px rgba(0,0,0,0.6),
        0 0 0 1px rgba(255,255,255,0.04) inset;
    }

    /* Display */
    .display {
      padding: 1.5rem 1.6rem 1.2rem;
      background: #0e0e16;
      border-bottom: 1px solid #1e1e2e;
      min-height: 130px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
    }

    .expression {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.85rem;
      color: #555;
      min-height: 1.2em;
      word-break: break-all;
      text-align: right;
      letter-spacing: 0.05em;
      transition: all 0.2s;
    }

    .result {
      font-family: 'Share Tech Mono', monospace;
      font-size: 2.6rem;
      color: #e0deff;
      text-align: right;
      letter-spacing: -0.02em;
      word-break: break-all;
      line-height: 1.1;
      margin-top: 0.4rem;
      transition: transform 0.1s ease;
    }

    .result.pop {
      transform: scale(1.04);
    }

    /* Buttons grid */
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: #1a1a26;
    }

    button {
      border: none;
      outline: none;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      font-weight: 400;
      padding: 1.1rem 0;
      transition: background 0.12s, transform 0.08s, color 0.12s;
      position: relative;
      overflow: hidden;
    }

    button::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0);
      transition: background 0.15s;
    }
    button:active::after { background: rgba(255,255,255,0.08); }
    button:active { transform: scale(0.95); }

    /* Number buttons */
    .btn-num {
      background: #1c1c28;
      color: #ddd;
    }
    .btn-num:hover { background: #24243a; color: #fff; }

    /* Operator buttons */
    .btn-op {
      background: #1a1a2e;
      color: #a78bfa;
      font-weight: 600;
    }
    .btn-op:hover { background: #22223a; color: #c4b5fd; }

    /* Equals */
    .btn-eq {
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: #fff;
      font-weight: 600;
      font-size: 1.3rem;
    }
    .btn-eq:hover { filter: brightness(1.15); }
    .btn-eq:active { filter: brightness(0.9); }

    /* Clear / function */
    .btn-fn {
      background: #1e1e2e;
      color: #f87171;
      font-weight: 500;
    }
    .btn-fn:hover { background: #2a1e2e; color: #fca5a5; }

    .btn-ac {
      background: #1e1e2e;
      color: #34d399;
      font-weight: 600;
    }
    .btn-ac:hover { background: #1e2a26; color: #6ee7b7; }

    /* Zero spans 2 cols */
    .span2 { grid-column: span 2; }

    /* History */
    .history-bar {
      padding: 0.6rem 1.4rem;
      background: #0e0e16;
      border-top: 1px solid #1e1e2e;
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .history-bar::-webkit-scrollbar { display: none; }

    .history-chip {
      background: #1e1e2e;
      color: #666;
      border-radius: 20px;
      padding: 0.2rem 0.7rem;
      font-size: 0.72rem;
      font-family: 'Share Tech Mono', monospace;
      white-space: nowrap;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .history-chip:hover { background: #2a2a42; color: #aaa; }

    .keyboard-hint {
      text-align: center;
      font-size: 0.67rem;
      color: #333;
      padding: 0.5rem;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>

<div class="calc-wrapper">
  <div class="calculator">
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>

    <div class="buttons">
      <!-- Row 1 -->
      <button class="btn-ac" onclick="clearAll()">AC</button>
      <button class="btn-fn" onclick="toggleSign()">+/−</button>
      <button class="btn-fn" onclick="percent()">%</button>
      <button class="btn-op" onclick="inputOp('/')">÷</button>

      <!-- Row 2 -->
      <button class="btn-num" onclick="inputNum('7')">7</button>
      <button class="btn-num" onclick="inputNum('8')">8</button>
      <button class="btn-num" onclick="inputNum('9')">9</button>
      <button class="btn-op" onclick="inputOp('*')">×</button>

      <!-- Row 3 -->
      <button class="btn-num" onclick="inputNum('4')">4</button>
      <button class="btn-num" onclick="inputNum('5')">5</button>
      <button class="btn-num" onclick="inputNum('6')">6</button>
      <button class="btn-op" onclick="inputOp('-')">−</button>

      <!-- Row 4 -->
      <button class="btn-num" onclick="inputNum('1')">1</button>
      <button class="btn-num" onclick="inputNum('2')">2</button>
      <button class="btn-num" onclick="inputNum('3')">3</button>
      <button class="btn-op" onclick="inputOp('+')">+</button>

      <!-- Row 5 -->
      <button class="btn-num span2" onclick="inputNum('0')">0</button>
      <button class="btn-num" onclick="inputDot()">.</button>
      <button class="btn-eq" onclick="calculate()">=</button>
    </div>

    <div class="history-bar" id="historyBar"></div>
    <div class="keyboard-hint">⌨ Keyboard supported</div>
  </div>
</div>

<script>
  let current = '0';
  let expression = '';
  let operator = null;
  let prev = null;
  let justCalc = false;
  let history = [];

  const resultEl = document.getElementById('result');
  const exprEl = document.getElementById('expression');
  const historyBar = document.getElementById('historyBar');

  function updateDisplay() {
    resultEl.textContent = current.length > 10 ? parseFloat(current).toExponential(4) : current;
    exprEl.textContent = expression;
  }

  function pop() {
    resultEl.classList.remove('pop');
    void resultEl.offsetWidth;
    resultEl.classList.add('pop');
    setTimeout(() => resultEl.classList.remove('pop'), 150);
  }

  function inputNum(n) {
    if (justCalc) { current = n; expression = ''; justCalc = false; }
    else if (current === '0' && n !== '.') current = n;
    else if (current.length < 12) current += n;
    updateDisplay();
  }

  function inputDot() {
    if (justCalc) { current = '0.'; justCalc = false; }
    else if (!current.includes('.')) current += '.';
    updateDisplay();
  }

  function inputOp(op) {
    justCalc = false;
    if (prev !== null && operator) {
      calculate(true);
    }
    prev = parseFloat(current);
    operator = op;
    const opSymbol = { '/': '÷', '*': '×', '-': '−', '+': '+' }[op];
    expression = `${prev} ${opSymbol}`;
    current = '0';
    updateDisplay();
  }

  function calculate(chained = false) {
    if (prev === null || !operator) return;
    const curr = parseFloat(current);
    let res;
    switch (operator) {
      case '+': res = prev + curr; break;
      case '-': res = prev - curr; break;
      case '*': res = prev * curr; break;
      case '/': res = curr === 0 ? 'Error' : prev / curr; break;
    }
    const opSymbol = { '/': '÷', '*': '×', '-': '−', '+': '+' }[operator];
    const histEntry = `${prev} ${opSymbol} ${curr} = ${res}`;
    if (!chained) {
      expression = histEntry;
      addHistory(histEntry);
    }
    current = res === 'Error' ? 'Error' : String(parseFloat(res.toFixed(10)));
    prev = chained ? parseFloat(current) : null;
    operator = null;
    if (!chained) justCalc = true;
    pop();
    updateDisplay();
  }

  function clearAll() {
    current = '0'; expression = ''; operator = null; prev = null; justCalc = false;
    updateDisplay();
  }

  function toggleSign() {
    current = current.startsWith('-') ? current.slice(1) : '-' + current;
    updateDisplay();
  }

  function percent() {
    current = String(parseFloat(current) / 100);
    updateDisplay();
  }

  function addHistory(entry) {
    history.unshift(entry);
    if (history.length > 6) history.pop();
    historyBar.innerHTML = history.map(h =>
      `<span class="history-chip" title="${h}">${h}</span>`
    ).join('');
  }

  // Keyboard support
  document.addEventListener('keydown', e => {
    if (e.key >= '0' && e.key <= '9') inputNum(e.key);
    else if (e.key === '.') inputDot();
    else if (e.key === '+') inputOp('+');
    else if (e.key === '-') inputOp('-');
    else if (e.key === '*') inputOp('*');
    else if (e.key === '/') { e.preventDefault(); inputOp('/'); }
    else if (e.key === 'Enter' || e.key === '=') calculate();
    else if (e.key === 'Escape') clearAll();
    else if (e.key === 'Backspace') {
      if (current.length > 1) current = current.slice(0, -1);
      else current = '0';
      updateDisplay();
    }
    else if (e.key === '%') percent();
  });
</script>
</body>
</html>
